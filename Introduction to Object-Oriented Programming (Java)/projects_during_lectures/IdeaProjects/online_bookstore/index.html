<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoBooks | 网上书店与音像系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">📚 EchoBooks 音像书店 (Java 原生连通版)</a>
            <button class="btn btn-outline-light btn-sm" onclick="showCart()">🛒 购物车 (<span id="cart-count">0</span>)</button>
        </div>
    </nav>

    <div class="bg-white py-4 border-bottom mb-4">
        <div class="container text-center">
            <h1 class="fw-bold text-dark fs-3">寻找文字与旋律的共鸣</h1>
            <p class="text-muted mb-0">实时读取 MySQL 数据库中的经典文学、珍稀乐谱与独立艺术黑胶</p>
        </div>
    </div>

    <div class="container mb-5">
        <h4 class="border-start border-4 border-dark ps-2 mb-4 fw-bold">书店商品列表</h4>
        
        <div class="row g-4" id="goods-list">
            <div class="text-center py-5">
                <div class="spinner-border text-dark mb-2" role="status"></div>
                <div class="text-muted">正在通过 Java 后端加载 MySQL 数据...</div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">🛒 我的购物车</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group mb-3" id="cart-items-list">
                        </ul>
                    <div class="text-end fw-bold fs-5">
                        总计: <span class="text-danger" id="cart-total">¥ 0.00</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">继续浏览</button>
                    <button type="button" class="btn btn-dark" onclick="checkout()">确认购买 (扣减数据库库存)</button>
                </div>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let cart = [];
        const modal = new bootstrap.Modal(document.getElementById('cartModal'));

        // 【核心机制】页面打开时，用 fetch 异步请求 Java 接口，读取 MySQL 的真实数据
        window.onload = function() {
            fetch('http://localhost:8080/api/books')
                .then(res => {
                    if (!res.ok) throw new Error('网络请求错误');
                    return res.json();
                })
                .then(books => {
                    const container = document.getElementById('goods-list');
                    container.innerHTML = ''; // 清空加载提示
                    
                    if (books.length === 0) {
                        container.innerHTML = '<div class="text-center text-muted py-5">数据库中暂无书籍数据</div>';
                        return;
                    }

                    books.forEach(book => {
                        container.innerHTML += `
                            <div class="col-md-4">
                                <div class="card h-100 p-3">
                                    <h5 class="fw-bold text-dark">${book.title}</h5>
                                    <p class="text-muted small mb-2">作者: ${book.author} | 库存: <span class="badge bg-dark">${book.stock}</span></p>
                                    <p class="text-secondary small flex-grow-1">${book.description || '暂无描述'}</p>
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <span class="text-danger fw-bold fs-5">¥ ${book.price.toFixed(2)}</span>
                                        <button class="btn btn-outline-dark btn-sm" onclick="addToCart('${book.title}', ${book.price}, ${book.bookId})">加入购物车</button>
                                    </div>
                                </div>
                            </div>`;
                    });
                })
                .catch(err => {
                    document.getElementById('goods-list').innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-danger text-center" role="alert">
                                ❌ 无法连通 Java 后端服务！<br>
                                <small class="text-secondary">请确保您已经在 IntelliJ IDEA 中成功运行了 BookServer 且控制台未报错。</small>
                            </div>
                        </div>`;
                });
        };

        function addToCart(title, price, id) {
            cart.push({ title, price, id });
            document.getElementById('cart-count').innerText = cart.length;
        }

        function showCart() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            let total = 0;
            
            if (cart.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted text-center py-3">购物车空空如也</li>';
            } else {
                cart.forEach(item => {
                    list.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span>${item.title}</span>
                            <span class="text-danger fw-bold">¥ ${item.price.toFixed(2)}</span>
                        </li>`;
                    total += item.price;
                });
            }
            document.getElementById('cart-total').innerText = `¥ ${total.toFixed(2)}`;
            modal.show();
        }

        function checkout() {
            if (cart.length === 0) {
                alert('您的购物车是空的！');
                return;
            }
            
            // 简单的购买成功提示（原生 JDBC 版由于未写 POST 路由接收端，此处在前端做模拟交互）
            alert('模拟购买成功！数据交互正常。');
            cart = [];
            document.getElementById('cart-count').innerText = 0;
            modal.hide();
        }
    </script>
</body>
</html>
